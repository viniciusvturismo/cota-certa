<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Grupos VTurismo</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style id="app-style">
  :root {
    --bg: #f4f9f7;
    --surface: #ffffff;
    --surface-2: #eaf3f0;
    --surface-3: #dfeeea;
    --border: #d7e6e1;
    --ink: #0f2621;
    --ink-muted: #5c7570;
    --ink-faint: #8aa39d;
    --brand: #0e6e63;
    --brand-strong: #0b3d38;
    --brand-chrome: #0b3d38;
    --brand-chrome-ink: #eaf6f2;
    --brand-chrome-muted: #b9d6cd;
    --brand-soft: #d9ece8;
    --accent: #b9812a;
    --accent-soft: #f6ecd8;
    --pending: #8a9a95;
    --pending-bg: #eef2f1;
    --quoted: #0e6e63;
    --quoted-bg: #dff0ec;
    --danger: #a5402f;
    --danger-soft: #f6e3de;
    --shadow: 0 1px 2px rgba(11,61,56,0.06), 0 8px 24px -12px rgba(11,61,56,0.18);
    --radius-s: 8px;
    --radius-m: 14px;
    --radius-l: 20px;
    --focus: #2f8a7c;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1613;
      --surface: #11201c;
      --surface-2: #16302a;
      --surface-3: #1c3a32;
      --border: #234339;
      --ink: #e7f3ef;
      --ink-muted: #96b3ac;
      --ink-faint: #6c8983;
      --brand: #4fbba9;
      --brand-strong: #8fd9c9;
      --brand-soft: #163c34;
      --accent: #e0b563;
      --accent-soft: #3a2d16;
      --pending: #75908a;
      --pending-bg: #17302a;
      --quoted: #4fbba9;
      --quoted-bg: #143b33;
      --danger: #e3806c;
      --danger-soft: #3a1f18;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
      --focus: #6fd2c0;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b1613;
    --surface: #11201c;
    --surface-2: #16302a;
    --surface-3: #1c3a32;
    --border: #234339;
    --ink: #e7f3ef;
    --ink-muted: #96b3ac;
    --ink-faint: #6c8983;
    --brand: #4fbba9;
    --brand-strong: #8fd9c9;
    --brand-soft: #163c34;
    --accent: #e0b563;
    --accent-soft: #3a2d16;
    --pending: #75908a;
    --pending-bg: #17302a;
    --quoted: #4fbba9;
    --quoted-bg: #143b33;
    --danger: #e3806c;
    --danger-soft: #3a1f18;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
    --focus: #6fd2c0;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #app { min-height: 100%; }
  ::selection { background: var(--brand-soft); }
  a { color: var(--brand); }
  button { font-family: inherit; }
  input, select, textarea { font-family: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .display { font-family: "Fraunces", Georgia, serif; }

  /* ---------- shell ---------- */
  .shell {
    display: grid;
    grid-template-columns: 280px minmax(0,1fr) 320px;
    grid-template-rows: auto minmax(0,1fr);
    height: 100vh;
  }
  @media (max-width: 1080px) {
    .shell { grid-template-columns: 240px minmax(0,1fr); }
    .summary-col { display: none; }
    .summary-col.mobile-open { display: block; grid-column: 1 / -1; }
  }
  @media (max-width: 720px) {
    .shell { grid-template-columns: 1fr; grid-template-rows: auto auto auto; height: auto; min-height: 100vh; }
    .sidebar { grid-column: 1; border-right: none; border-bottom: 1px solid var(--border); overflow-y: visible; max-height: none; }
    .main { overflow-y: visible; max-height: none; }
    .summary-col { overflow-y: visible; max-height: none; }
  }

  .topbar {
    grid-column: 1 / -1;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 24px;
    background: var(--brand-chrome);
    color: var(--brand-chrome-ink);
  }
  .brandmark { display: flex; align-items: center; gap: 10px; }
  .brandmark .glyph {
    width: 30px; height: 30px; border-radius: 9px;
    background: var(--accent); color: var(--brand-chrome);
    display: flex; align-items: center; justify-content: center;
    font-family: "Fraunces", serif; font-weight: 700; font-size: 16px;
  }
  .brandmark .word { font-family: "Fraunces", serif; font-weight: 600; font-size: 19px; letter-spacing: 0.2px; }
  .brandmark .tag { font-size: 11.5px; color: #b9d6cd; margin-left: 8px; padding-left: 8px; border-left: 1px solid #2f5a52; }
  .conn-badge {
    display: flex; align-items: center; gap: 7px;
    font-size: 12px; padding: 6px 12px; border-radius: 999px;
    background: rgba(255,255,255,0.08); color: #cfe8e1;
  }
  .conn-dot { width: 7px; height: 7px; border-radius: 50%; background: #6fd6bd; }
  .conn-badge.readonly { background: rgba(224,181,99,0.18); color: #f1d9ad; }
  .conn-badge.readonly .conn-dot { background: var(--accent); }
  .conn-badge.local .conn-dot { background: #9fb3ad; }

  .sidebar {
    border-right: 1px solid var(--border);
    background: var(--surface);
    padding: 18px 14px 24px;
    overflow-y: auto;
  }
  .sidebar-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 6px 14px;
  }
  .sidebar-title { font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-faint); }
  .new-op-btn {
    border: 1px dashed var(--border); background: transparent; color: var(--brand);
    border-radius: var(--radius-m); padding: 10px 12px; width: 100%;
    font-size: 13.5px; font-weight: 600; cursor: pointer; margin-top: 10px;
    display: flex; align-items: center; gap: 8px; justify-content: center;
  }
  .new-op-btn:hover { background: var(--surface-2); border-color: var(--brand); }

  .op-card {
    display: block; width: 100%; text-align: left;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-m); padding: 12px 13px; margin-bottom: 8px;
    cursor: pointer; transition: background 0.12s, border-color 0.12s;
  }
  .op-card:hover { background: var(--surface-2); }
  .op-card.active { background: var(--brand-soft); border-color: var(--brand); }
  .op-name { font-weight: 600; font-size: 14px; color: var(--ink); margin-bottom: 2px; }
  .op-client { font-size: 12px; color: var(--ink-muted); margin-bottom: 9px; }
  .op-progress-row { display: flex; align-items: center; gap: 8px; }
  .op-progress-track { flex: 1; height: 5px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
  .op-progress-fill { height: 100%; background: var(--brand); border-radius: 3px; }
  .op-progress-label { font-size: 11px; color: var(--ink-faint); font-family: "IBM Plex Mono", monospace; }
  .op-price { margin-top: 8px; font-family: "IBM Plex Mono", monospace; font-size: 13px; color: var(--brand-strong); font-weight: 600; }

  /* ---------- main ---------- */
  .main { padding: 26px 30px 60px; overflow-y: auto; }
  .hint-banner {
    display: flex; align-items: flex-start; gap: 12px; background: var(--accent-soft);
    border: 1px solid var(--accent); border-radius: var(--radius-m); padding: 12px 14px; margin-bottom: 18px;
  }
  .hint-banner-text { flex: 1; font-size: 13px; line-height: 1.55; color: var(--ink); }
  .hint-banner .icon-btn { flex-shrink: 0; background: transparent; border-color: transparent; }
  .op-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 22px; flex-wrap: wrap; }
  .op-title-input {
    font-family: "Fraunces", serif; font-weight: 600; font-size: 27px; color: var(--brand-strong);
    border: none; background: transparent; padding: 2px 0; width: 100%; max-width: 520px;
  }
  .op-meta-row { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 6px; }
  .meta-field { display: flex; flex-direction: column; gap: 3px; }
  .meta-field label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-faint); font-weight: 600; }
  .meta-field input {
    border: 1px solid var(--border); border-radius: var(--radius-s); padding: 6px 9px;
    font-size: 13.5px; background: var(--surface); color: var(--ink); width: 128px;
    font-family: "IBM Plex Mono", monospace;
  }
  .op-actions { display: flex; gap: 8px; }
  .icon-btn {
    border: 1px solid var(--border); background: var(--surface); color: var(--ink-muted);
    border-radius: var(--radius-s); width: 34px; height: 34px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 15px;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--danger); border-color: var(--danger-soft); }

  .category {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-l);
    margin-bottom: 16px; overflow: hidden;
  }
  .category-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; cursor: pointer; gap: 14px;
  }
  .category-head:hover { background: var(--surface-2); }
  .category-head-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .chevron { font-size: 11px; color: var(--ink-faint); transition: transform 0.15s; flex-shrink: 0; }
  .category.collapsed .chevron { transform: rotate(-90deg); }
  .category-name-input {
    font-weight: 600; font-size: 15.5px; border: none; background: transparent; color: var(--ink);
    min-width: 60px; padding: 2px 0;
  }
  .category-count { font-size: 12px; color: var(--ink-faint); flex-shrink: 0; }
  .category-subtotal { font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 14.5px; color: var(--brand-strong); flex-shrink: 0; }
  .category-body { border-top: 1px solid var(--border); }
  .category.collapsed .category-body { display: none; }

  .item-row {
    display: grid;
    grid-template-columns: 22px minmax(0,1.25fr) minmax(0,0.8fr) 118px 108px 52px;
    align-items: center; gap: 7px;
    padding: 10px 18px; border-bottom: 1px solid var(--border);
  }
  .item-row:last-child { border-bottom: none; }
  .item-row:hover { background: var(--surface-2); }
  .item-note {
    grid-column: 2 / -1; margin-top: -4px; padding: 0 0 8px; font-size: 11.5px; color: var(--ink-faint);
  }
  @media (max-width: 900px) {
    .item-row { grid-template-columns: 20px 1fr 1fr 84px; row-gap: 6px; }
  }
  @media (max-width: 620px) {
    .item-row { display: flex; flex-wrap: wrap; row-gap: 6px; }
    .item-row > * { flex: 1 1 118px; }
    .item-row .chk { flex: 0 0 auto; }
    .item-row .row-actions { flex: 0 0 auto; }
    .item-note { margin-left: 0; }
  }

  .kind-badge {
    font-size: 11px; color: var(--ink-faint); white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; padding: 0 2px;
  }
  .kind-select {
    border: 1px solid var(--border); background: var(--surface-2); color: var(--ink-muted);
    border-radius: 6px; font-size: 11px; padding: 5px 3px; width: 100%;
  }
  .value-computed {
    text-align: right; font-size: 12.5px; font-weight: 600; color: var(--brand-strong);
    padding: 5px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row-actions { display: flex; gap: 2px; justify-content: flex-end; }
  .expand-btn {
    border: none; background: transparent; color: var(--ink-faint); cursor: pointer;
    width: 24px; height: 26px; border-radius: 6px; font-size: 11px; transition: transform 0.15s;
  }
  .expand-btn:hover { background: var(--surface-3); color: var(--brand); }
  .expand-btn.open { transform: rotate(180deg); color: var(--brand); }

  .item-detail {
    grid-column: 1 / -1; margin: 2px 0 12px; padding: 12px 14px; background: var(--surface-2);
    border-radius: var(--radius-m); display: flex; flex-direction: column; gap: 12px;
  }
  .detail-block-head {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-faint);
  }
  .legs-table, .fares-table { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .leg-row {
    display: grid; grid-template-columns: 1fr 0.8fr 1.3fr 1.3fr 26px; gap: 6px; align-items: center;
  }
  .leg-row.leg-head { font-size: 10.5px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.03em; font-weight: 600; }
  .leg-row input {
    border: 1px solid var(--border); background: var(--surface); color: var(--ink);
    border-radius: 6px; padding: 6px 8px; font-size: 12.5px; width: 100%;
  }
  .fare-row { display: grid; grid-template-columns: 1fr 120px 26px; gap: 6px; align-items: center; }
  .fare-row input {
    border: 1px solid var(--border); background: var(--surface); color: var(--ink);
    border-radius: 6px; padding: 6px 8px; font-size: 12.5px; width: 100%;
  }
  .fare-row input[type="number"] { text-align: right; font-family: "IBM Plex Mono", monospace; }
  .add-row-btn {
    align-self: flex-start; border: 1px dashed var(--border); background: transparent; color: var(--brand);
    border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; margin-top: 8px;
  }
  .add-row-btn:hover { background: var(--surface); border-color: var(--brand); }
  .field-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px,1fr)); gap: 10px; }
  .field-row label { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-faint); font-weight: 600; margin-bottom: 4px; }
  .field-row input {
    border: 1px solid var(--border); background: var(--surface); color: var(--ink);
    border-radius: 6px; padding: 7px 9px; font-size: 13px; width: 100%;
  }
  .note-label { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-faint); font-weight: 600; margin-bottom: 4px; }
  .note-input {
    border: 1px solid var(--border); background: var(--surface); color: var(--ink);
    border-radius: 8px; padding: 8px 10px; font-size: 12.5px; width: 100%; min-height: 44px;
    font-family: inherit; resize: vertical;
  }
  .item-row.alt-option { background: var(--pending-bg); }
  .item-row.alt-option:hover { background: var(--surface-3); }
  .alt-badge {
    display: inline-block; font-size: 9px; font-weight: 700; letter-spacing: 0.04em;
    color: var(--ink-muted); background: var(--surface-3); border-radius: 4px; padding: 1px 5px; margin-left: 5px; vertical-align: middle;
  }
  .compare-block { background: var(--pending-bg); border-radius: 10px; padding: 10px 12px; margin: -2px 0 2px; }
  .compare-toggle { display: flex; align-items: flex-start; gap: 8px; font-size: 12.5px; color: var(--ink); cursor: pointer; }
  .compare-toggle input { margin-top: 2px; }
  .research-block { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: -2px 0 2px; }
  .research-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .supplier-url-input {
    flex: 1 1 220px; border: 1px solid var(--border); background: var(--surface); color: var(--ink);
    border-radius: 6px; padding: 7px 9px; font-size: 12.5px;
  }
  .research-btn {
    flex: 0 0 auto; border: none; background: var(--accent); color: var(--brand-chrome);
    border-radius: 8px; padding: 8px 14px; font-size: 12.5px; font-weight: 700; cursor: pointer; white-space: nowrap;
  }
  .research-btn:hover { filter: brightness(0.94); }

  .chk {
    width: 19px; height: 19px; border-radius: 6px; border: 1.5px solid var(--border);
    background: var(--surface); cursor: pointer; position: relative; flex-shrink: 0; appearance: none;
  }
  .chk:checked { background: var(--quoted); border-color: var(--quoted); }
  .chk:checked::after {
    content: ""; position: absolute; left: 5px; top: 1px; width: 5px; height: 10px;
    border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg);
  }
  .item-name-input, .item-supplier-input {
    border: none; background: transparent; font-size: 13.5px; color: var(--ink); padding: 5px 6px;
    border-radius: 6px; min-width: 0; width: 100%;
  }
  .item-name-input:hover, .item-supplier-input:hover,
  .item-name-input:focus, .item-supplier-input:focus { background: var(--surface-2); }
  .item-supplier-input { color: var(--ink-muted); }
  .item-supplier-input::placeholder, .item-name-input::placeholder { color: var(--ink-faint); }
  .unit-select, .currency-select {
    border: 1px solid var(--border); background: var(--surface); color: var(--ink-muted);
    border-radius: 6px; font-size: 11.5px; padding: 5px 4px; width: 100%;
  }
  .value-wrap { display: flex; align-items: center; gap: 4px; }
  .value-input {
    border: 1px solid var(--border); background: var(--surface); color: var(--ink);
    border-radius: 6px; padding: 5px 7px; font-size: 13px; width: 100%; text-align: right;
    font-family: "IBM Plex Mono", monospace;
  }
  .value-input:focus { border-color: var(--brand); }
  .row-del {
    border: none; background: transparent; color: var(--ink-faint); cursor: pointer;
    width: 26px; height: 26px; border-radius: 6px; font-size: 14px;
  }
  .row-del:hover { background: var(--danger-soft); color: var(--danger); }

  .add-item-btn {
    display: flex; align-items: center; gap: 6px; width: 100%;
    padding: 10px 18px; border: none; background: transparent; color: var(--brand);
    font-size: 13px; font-weight: 600; cursor: pointer; text-align: left;
  }
  .add-item-btn:hover { background: var(--surface-2); }

  .add-category-btn {
    display: flex; align-items: center; gap: 8px; justify-content: center;
    width: 100%; padding: 13px; border: 1px dashed var(--border); background: transparent;
    color: var(--ink-muted); border-radius: var(--radius-m); font-size: 13.5px; font-weight: 600; cursor: pointer;
  }
  .add-category-btn:hover { border-color: var(--brand); color: var(--brand); background: var(--surface-2); }

  /* ---------- summary column ---------- */
  .summary-col { border-left: 1px solid var(--border); background: var(--surface); padding: 22px 20px 40px; overflow-y: auto; }
  .summary-block { margin-bottom: 22px; }
  .summary-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint); font-weight: 600; margin-bottom: 10px; }
  .progress-big-track { height: 8px; border-radius: 4px; background: var(--surface-3); overflow: hidden; margin-bottom: 8px; }
  .progress-big-fill { height: 100%; background: var(--brand); border-radius: 4px; transition: width 0.2s; }
  .progress-big-text { font-size: 13px; color: var(--ink-muted); }
  .progress-big-text strong { color: var(--ink); font-family: "IBM Plex Mono", monospace; }

  .param-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; gap: 10px; }
  .param-row label { font-size: 12.5px; color: var(--ink-muted); }
  .param-input {
    border: 1px solid var(--border); background: var(--bg); color: var(--ink);
    border-radius: 6px; padding: 5px 8px; width: 84px; text-align: right; font-size: 13px;
    font-family: "IBM Plex Mono", monospace;
  }

  .ledger-row { display: flex; align-items: baseline; justify-content: space-between; padding: 6px 0; font-size: 13px; }
  .ledger-row.muted { color: var(--ink-muted); }
  .ledger-row .val { font-family: "IBM Plex Mono", monospace; }
  .ledger-divider { border-top: 1px solid var(--border); margin: 8px 0; }
  .ledger-total {
    background: var(--brand-chrome); color: var(--brand-chrome-ink); border-radius: var(--radius-m);
    padding: 16px 16px; margin-top: 6px;
  }
  .ledger-total .lbl { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.05em; color: #b9d6cd; margin-bottom: 4px; }
  .ledger-total .amt { font-family: "Fraunces", serif; font-weight: 600; font-size: 27px; }
  .ledger-total .per-pax { font-size: 12.5px; color: #b9d6cd; margin-top: 6px; font-family: "IBM Plex Mono", monospace; }
  .ledger-total.avista {
    background: var(--accent-soft); color: var(--ink); border: 1px solid var(--accent);
  }
  .ledger-total.avista .lbl { color: var(--accent); }
  .ledger-total.avista .amt { color: var(--ink); }
  .ledger-total.avista .per-pax { color: var(--ink-muted); }

  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .chip.quoted { background: var(--quoted-bg); color: var(--quoted); }
  .chip.pending { background: var(--pending-bg); color: var(--pending); }

<script id="app-script">
(function () {
  "use strict";

  var STATE_EL = document.getElementById("state-data");
  var STATE = JSON.parse(STATE_EL.textContent);

  var LOCAL_KEY = "cotacerta_ui_v1";
  var local = { activeOperationId: STATE.operations[0] ? STATE.operations[0].id : null, collapsed: {}, expandedItems: {}, summaryOpenMobile: false, hintDismissed: false };
  try {
    var savedLocal = JSON.parse(localStorage.getItem(LOCAL_KEY) || "null");
    if (savedLocal) local = Object.assign(local, savedLocal);
  } catch (e) {}

  var readOnly = false;
  var connMode = "checking"; // checking | synced | local
  var applyingRemote = false;
  var firebaseReadyPromise = null;

  function saveLocalUI() {
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(local)); } catch (e) {}
  }

  function timeoutAfter(ms) {
    return new Promise(function (_, reject) { setTimeout(function () { reject(new Error("timeout")); }, ms); });
  }

  function getFirebaseBridge() {
    if (firebaseReadyPromise) return firebaseReadyPromise;
    firebaseReadyPromise = new Promise(function (resolve) {
      (function check() {
        if (window.__cotaCertaFirebase) resolve(window.__cotaCertaFirebase);
        else setTimeout(check, 50);
      })();
    });
    return Promise.race([firebaseReadyPromise, timeoutAfter(4000)]).catch(function () { return null; });
  }

  function uid(prefix) {
    return (prefix || "id") + "-" + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
  }

  function fmtBRL(n) {
    if (n === null || n === undefined || isNaN(n)) return "—";
    return "R$ " + n.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function fmtUSD(n) {
    if (n === null || n === undefined || isNaN(n)) return "—";
    return "US$ " + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function fmtPct(n) {
    return (n * 100).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + "%";
  }

  var ITEM_KINDS = {
    simples: { label: "Simples" },
    voo: { label: "Aéreo (voo)", hasLegs: true,
      legTemplate: { cia: "", voo: "", trecho: "", horario: "" },
      defaultFares: ["Tarifa individual", "Taxa de embarque", "Outras taxas (RAC/DU)"] },
    hospedagem: { label: "Hospedagem", fields: [
      { key: "categoria", label: "Categoria do quarto", type: "text" },
      { key: "noites", label: "Nº de noites", type: "number" },
      { key: "diaria", label: "Valor da diária", type: "number" },
      { key: "taxas", label: "Taxas (limpeza/serviço)", type: "number" }
    ] },
    transfer: { label: "Transfer", fields: [
      { key: "veiculo", label: "Tipo de veículo", type: "text" },
      { key: "capacidade", label: "Capacidade (pax)", type: "number" },
      { key: "motoristas", label: "Nº de motoristas", type: "number" },
      { key: "valor", label: "Valor do serviço", type: "number" }
    ] },
    ingresso: { label: "Ingresso / Parque", fields: [
      { key: "tipo", label: "Tipo de ingresso", type: "text" },
      { key: "dias", label: "Nº de dias", type: "text" },
      { key: "expressPass", label: "Express/Fast Pass incluso", type: "text" },
      { key: "valorUnit", label: "Valor unitário", type: "number" }
    ] },
    seguro: { label: "Seguro", fields: [
      { key: "cobertura", label: "Cobertura (US$)", type: "text" },
      { key: "salaVip", label: "Inclui Sala VIP", type: "text" },
      { key: "valor", label: "Valor", type: "number" }
    ] },
    veiculo: { label: "Van / Veículo", fields: [
      { key: "modelo", label: "Modelo do veículo", type: "text" },
      { key: "diarias", label: "Nº de diárias", type: "number" },
      { key: "valorDiaria", label: "Valor por diária", type: "number" }
    ] }
  };

  function num(v) { var n = Number(v); return isNaN(n) ? 0 : n; }

  function ensureKindDefaults(item) {
    var kind = item.kind || "simples";
    var def = ITEM_KINDS[kind];
    if (kind === "voo") {
      if (!item.legs || !item.legs.length) item.legs = [Object.assign({}, def.legTemplate)];
      if (!item.fares || !item.fares.length) item.fares = def.defaultFares.map(function (l) { return { label: l, value: null }; });
    } else if (def.fields) {
      item.fields = item.fields || {};
    }
  }

  function derivedValue(item) {
    var kind = item.kind || "simples";
    if (kind === "simples") {
      return (item.value === null || item.value === undefined || item.value === "") ? null : Number(item.value);
    }
    if (kind === "voo") {
      if (!item.fares || !item.fares.length) return null;
      return item.fares.reduce(function (s, f) { return s + num(f.value); }, 0);
    }
    var f = item.fields || {};
    if (kind === "hospedagem") return num(f.diaria) * num(f.noites) + num(f.taxas);
    if (kind === "transfer") return num(f.valor);
    if (kind === "ingresso") return num(f.valorUnit);
    if (kind === "seguro") return num(f.valor);
    if (kind === "veiculo") return num(f.valorDiaria) * num(f.diarias);
    return item.value === null || item.value === undefined ? null : Number(item.value);
  }

  function itemValueBRL(item, pax, dollarRate) {
    if (item.altOnly) return 0;
    var raw = derivedValue(item);
    if (raw === null || raw === undefined || isNaN(raw)) return 0;
    var v = Number(raw);
    if (item.currency === "USD") v = v * (Number(dollarRate) || 0);
    if (item.unit === "pax") v = v * (Number(pax) || 0);
    return v;
  }

  function computeOperation(op) {
    var A = 0, itemsTotal = 0, itemsQuoted = 0;
    op.categories.forEach(function (cat) {
      cat.items.forEach(function (it) {
        itemsTotal++;
        if (it.quoted) itemsQuoted++;
        A += itemValueBRL(it, op.pax, op.dollarRate);
      });
    });
    var markup = A * (Number(op.markupPct) || 0);
    var contingencia = A * (Number(op.contingencyPct) || 0);
    var mimos = (Number(op.pax) || 0) * (Number(op.giftPerPax) || 0);
    var subtotalAntes = A + markup + contingencia + mimos;
    var tax = Number(op.taxPct) || 0;
    var precoVenda = tax < 1 ? subtotalAntes / (1 - tax) : subtotalAntes;
    var imposto = precoVenda - subtotalAntes;
    var precoPorPax = op.pax ? precoVenda / op.pax : 0;
    var avistaPct = Number(op.avistaDiscountPct) || 0;
    var precoAvista = precoVenda * (1 - avistaPct);
    var precoAvistaPorPax = op.pax ? precoAvista / op.pax : 0;
    return { A: A, markup: markup, contingencia: contingencia, mimos: mimos, subtotalAntes: subtotalAntes, imposto: imposto, precoVenda: precoVenda, precoPorPax: precoPorPax, precoAvista: precoAvista, precoAvistaPorPax: precoAvistaPorPax, itemsTotal: itemsTotal, itemsQuoted: itemsQuoted };
  }

  function categorySubtotal(cat, op) {
    var t = 0;
    cat.items.forEach(function (it) { t += itemValueBRL(it, op.pax, op.dollarRate); });
    return t;
  }

  function getActiveOp() {
    var op = STATE.operations.find(function (o) { return o.id === local.activeOperationId; });
    if (!op) op = STATE.operations[0];
    return op;
  }

  function esc(s) {
    return String(s === null || s === undefined ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  var toastTimer = null;
  function showToast(msg, danger) {
    var el = document.getElementById("toast");
    if (el) el.remove();
    el = document.createElement("div");
    el.id = "toast";
    el.className = "toast" + (danger ? " danger" : "");
    el.textContent = msg;
    document.body.appendChild(el);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.remove(); }, 3200);
  }

  var pendingPublish = null;
  function scheduleSave(immediate) {
    if (pendingPublish) clearTimeout(pendingPublish);
    var delay = immediate ? 0 : 650;
    pendingPublish = setTimeout(persist, delay);
  }

  async function persist() {
    if (applyingRemote) return; // eco do nosso próprio snapshot, não regravar
    var fb = await getFirebaseBridge();
    if (!fb) {
      connMode = "local";
      try { localStorage.setItem("cotacerta_state_v1", JSON.stringify(STATE)); } catch (e) {}
      showToast("Sem conexão com o banco — salvo só neste navegador.", true);
      render();
      return;
    }
    try {
      await fb.setDoc(fb.ref, STATE);
      connMode = "synced";
    } catch (err) {
      connMode = "local";
      try { localStorage.setItem("cotacerta_state_v1", JSON.stringify(STATE)); } catch (e) {}
      showToast("Não consegui sincronizar agora — salvo só neste navegador.", true);
      render();
    }
  }

  function loadLocalState() {
    try {
      var saved = JSON.parse(localStorage.getItem("cotacerta_state_v1") || "null");
      if (saved) STATE = saved;
    } catch (e) {}
  }

  async function initConn() {
    var fb = await getFirebaseBridge();
    if (!fb) {
      connMode = "local";
      loadLocalState();
      render();
      return;
    }
    fb.onSnapshot(fb.ref, function (snap) {
      if (snap.exists()) {
        applyingRemote = true;
        STATE = snap.data();
        connMode = "synced";
        render();
        applyingRemote = false;
      } else {
        connMode = "synced";
        fb.setDoc(fb.ref, STATE).catch(function () {});
        render();
      }
    }, function () {
      connMode = "local";
      loadLocalState();
      showToast("Sem conexão com o banco — salvo só neste navegador.", true);
      render();
    });
  }

  /* ---------------- mutations ---------------- */

  function addOperation(name, client, pax) {
    var op = {
      id: uid("op"), name: name || "Nova operação", client: client || "", pax: pax || 15,
      dollarRate: 5.6, markupPct: 0.25, contingencyPct: 0.04, giftPerPax: 800, taxPct: 0.06,
      categories: [{ id: uid("cat"), name: "Geral", items: [] }]
    };
    STATE.operations.push(op);
    local.activeOperationId = op.id;
    saveLocalUI();
    scheduleSave(true);
  }

  function removeOperation(opId) {
    STATE.operations = STATE.operations.filter(function (o) { return o.id !== opId; });
    if (local.activeOperationId === opId) local.activeOperationId = STATE.operations[0] ? STATE.operations[0].id : null;
    saveLocalUI();
    scheduleSave(true);
  }

  function addCategory(op) {
    op.categories.push({ id: uid("cat"), name: "Nova categoria", items: [] });
    scheduleSave(true);
  }
  function removeCategory(op, catId) {
    op.categories = op.categories.filter(function (c) { return c.id !== catId; });
    scheduleSave(true);
  }
  function addItem(op, cat) {
    cat.items.push({ id: uid("it"), name: "Novo item", supplier: "", currency: "BRL", unit: "total", value: null, quoted: false, note: "" });
    scheduleSave(true);
  }
  function removeItem(cat, itemId) {
    cat.items = cat.items.filter(function (i) { return i.id !== itemId; });
    scheduleSave(true);

  /* ---------------- rendering ---------------- */

  function connBadgeHTML() {
    if (connMode === "readonly") return '<div class="conn-badge readonly"><span class="conn-dot"></span>Somente leitura</div>';
    if (connMode === "local") return '<div class="conn-badge local"><span class="conn-dot"></span>Salvo neste navegador</div>';
    if (connMode === "checking") return '<div class="conn-badge local"><span class="conn-dot"></span>Conectando…</div>';
    return '<div class="conn-badge"><span class="conn-dot"></span>Sincronizado</div>';
  }

  function renderSidebar() {
    var html = '<div class="sidebar-head"><div class="sidebar-title">Operações</div></div>';
    STATE.operations.forEach(function (op) {
      var stats = computeOperation(op);
      var pct = stats.itemsTotal ? Math.round((stats.itemsQuoted / stats.itemsTotal) * 100) : 0;
      var active = op.id === (getActiveOp() || {}).id;
      html += '<button class="op-card' + (active ? " active" : "") + '" data-op="' + op.id + '">' +
        '<div class="op-name">' + esc(op.name) + '</div>' +
        '<div class="op-client">' + esc(op.client || "Sem cliente definido") + '</div>' +
        '<div class="op-progress-row"><div class="op-progress-track"><div class="op-progress-fill" style="width:' + pct + '%"></div></div>' +
        '<div class="op-progress-label">' + stats.itemsQuoted + '/' + stats.itemsTotal + '</div></div>' +
        '<div class="op-price mono">' + fmtBRL(stats.precoVenda) + '</div>' +
        '</button>';
    });
    html += '<button class="new-op-btn" id="btn-new-op">+ Nova operação</button>';
    return html;
  }

  function kindOptionsHTML(selected) {
    return Object.keys(ITEM_KINDS).map(function (k) {
      return '<option value="' + k + '"' + (k === selected ? " selected" : "") + '>' + ITEM_KINDS[k].label + '</option>';
    }).join("");
  }

  function fmtMoney(n, currency) {
    if (n === null || n === undefined || isNaN(n)) return "—";
    var sym = currency === "USD" ? "US$ " : "R$ ";
    return sym + Number(n).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(function () { fallbackCopy(text); });
    } else {
      fallbackCopy(text);
    }
  }
  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
  }

  function buildResearchPrompt(op, cat, item) {
    var siteUrl = window.location.href;
    var header = 'Operação: "' + op.name + '" (cliente: ' + (op.client || "—") + ', ' + op.pax + ' participantes)\n' +
      'Grupos VTurismo: ' + siteUrl + '\n' +
      'Categoria: ' + cat.name + ' · Item: "' + item.name + '" (id do item: ' + item.id + ')\n';
    if (item.kind === "voo") {
      return header +
        'Isto é um item de AÉREO — antes de preencher qualquer coisa no Grupos VTurismo, faça a análise aqui no chat primeiro:\n' +
        '1. Pesquise as opções de voo cabíveis (rota, datas e nº de passageiros da operação acima; use o link/companhia abaixo como ponto de partida se houver).\n' +
        '2. Traga um comparativo (companhia, conexões, horários, preço por pessoa) como já fizemos antes para o BRUSA Volleyball.\n' +
        '3. NÃO atualize o Grupos VTurismo ainda — espere eu escolher a opção.\n' +
        '4. Só depois que eu confirmar qual opção, você preenche os trechos e as tarifas desse item no Grupos VTurismo (o site é editado ao vivo — as mudanças aparecem sozinhas pra quem estiver com a página aberta).\n' +
        (item.supplierUrl ? "Link de referência: " + item.supplierUrl + "\n" : "") +
        (item.note ? "Observações já registradas: " + item.note + "\n" : "");
    }
    return header +
      'Fornecedor: ' + (item.supplier || "(sem nome definido)") + (item.supplierUrl ? " — " + item.supplierUrl : "") + '\n' +
      'Use a extensão Claude em Chrome (já logado) para abrir o link acima, encontrar a cotação/condições atuais para este item, e me mostrar o que encontrou.\n' +
      'Depois de eu confirmar, atualize esse item no Grupos VTurismo (mesmo link acima) com o valor encontrado e marque como cotado.\n' +
      (item.note ? "Observações já registradas: " + item.note + "\n" : "");
  }

  function legsTableHTML(it, disabled) {
    var legs = it.legs || [];
    var rows = legs.map(function (leg, idx) {
      return '<div class="leg-row" data-leg-idx="' + idx + '">' +
        '<input placeholder="Cia aérea" value="' + esc(leg.cia) + '" data-leg-field="cia" ' + disabled + ' />' +
        '<input placeholder="Nº do voo" value="' + esc(leg.voo) + '" data-leg-field="voo" ' + disabled + ' />' +
        '<input placeholder="Trecho (ex.: GIG → SCL)" value="' + esc(leg.trecho) + '" data-leg-field="trecho" ' + disabled + ' />' +
        '<input placeholder="Horário (ex.: 22:30 → 06:15)" value="' + esc(leg.horario) + '" data-leg-field="horario" ' + disabled + ' />' +
        (disabled ? "" : '<button class="row-del" data-action="remove-leg" data-leg-idx="' + idx + '" title="Remover trecho">×</button>') +
        '</div>';
    }).join("");
    return '<div class="detail-block"><div class="detail-block-head"><span>Trechos / conexões</span></div>' +
      '<div class="legs-table">' +
      '<div class="leg-row leg-head"><span>Cia aérea</span><span>Nº do voo</span><span>Trecho</span><span>Horário</span><span></span></div>' +
      rows +
      '</div>' +
      (disabled ? "" : '<button class="add-row-btn" data-action="add-leg">+ Adicionar trecho / conexão</button>') +
      '</div>';
  }

  function faresTableHTML(it, disabled) {
    var fares = it.fares || [];
    var rows = fares.map(function (fare, idx) {
      return '<div class="fare-row" data-fare-idx="' + idx + '">' +
        '<input placeholder="Descrição (ex.: Tarifa individual)" value="' + esc(fare.label) + '" data-fare-field="label" ' + disabled + ' />' +
        '<input type="number" step="0.01" placeholder="0,00" value="' + (fare.value === null || fare.value === undefined ? "" : fare.value) + '" data-fare-field="value" ' + disabled + ' />' +
        (disabled ? "" : '<button class="row-del" data-action="remove-fare" data-fare-idx="' + idx + '" title="Remover">×</button>') +
        '</div>';
    }).join("");
    var total = fares.reduce(function (s, f) { return s + num(f.value); }, 0);
    return '<div class="detail-block"><div class="detail-block-head"><span>Tarifa individual, taxas e demais valores</span><span class="mono">' + fmtMoney(total, it.currency) + '</span></div>' +
      '<div class="fares-table">' + rows + '</div>' +
      (disabled ? "" : '<button class="add-row-btn" data-action="add-fare">+ Adicionar tarifa/taxa</button>') +
      '</div>';
  }

  function fieldsFormHTML(it, kindDef, disabled) {
    var f = it.fields || {};
    var rows = kindDef.fields.map(function (fd) {
      return '<div class="field-row">' +
        '<label>' + esc(fd.label) + '</label>' +
        '<input data-field-key="' + fd.key + '" type="' + (fd.type === "number" ? "number" : "text") + '" ' + (fd.type === "number" ? 'step="0.01"' : '') +
        ' value="' + esc(f[fd.key] === undefined || f[fd.key] === null ? "" : f[fd.key]) + '" ' + disabled + ' />' +
        '</div>';
    }).join("");
    return '<div class="detail-block"><div class="field-grid">' + rows + '</div></div>';
  }

  function itemRowHTML(op, cat, it) {
    var kind = it.kind || "simples";
    var kindDef = ITEM_KINDS[kind];
    var expanded = !!local.expandedItems[it.id];
    var dis = readOnly ? "disabled" : "";
    var valueCellHTML;
    if (kind === "simples") {
      valueCellHTML = '<div class="value-wrap"><input class="value-input" type="number" step="0.01" value="' + (it.value === null || it.value === undefined ? "" : it.value) + '" placeholder="0,00" data-field="value" ' + dis + ' />' + (it.altOnly ? '<span class="alt-badge">ALT</span>' : '') + '</div>';
    } else {
      valueCellHTML = '<div class="value-computed mono" title="Calculado a partir do detalhamento">' + fmtMoney(derivedValue(it), it.currency) + (it.altOnly ? ' <span class="alt-badge">ALT</span>' : '') + '</div>';
    }
    var detailHTML = "";
    detailHTML += '<div class="detail-block"><div class="detail-block-head"><span>Tipo, moeda e unidade</span></div>' +
      '<div class="field-grid" style="margin-top:8px;">' +
      '<div class="field-row"><label>Tipo de item</label><select class="kind-select" data-field="kind" ' + dis + '>' + kindOptionsHTML(kind) + '</select></div>' +
      '<div class="field-row"><label>Moeda</label><select class="currency-select" data-field="currency" ' + dis + '>' +
      '<option value="BRL"' + (it.currency === "BRL" ? " selected" : "") + '>BRL</option>' +
      '<option value="USD"' + (it.currency === "USD" ? " selected" : "") + '>USD</option>' +
      '</select></div>' +
      '<div class="field-row"><label>Unidade</label><select class="unit-select" data-field="unit" ' + dis + '>' +
      '<option value="total"' + (it.unit === "total" ? " selected" : "") + '>total</option>' +
      '<option value="pax"' + (it.unit === "pax" ? " selected" : "") + '>por pax</option>' +
      '</select></div>' +
      '</div></div>' +
      '<div class="detail-block compare-block">' +
      '<label class="compare-toggle"><input type="checkbox" class="alt-checkbox" data-field="altOnly" ' + (it.altOnly ? "checked" : "") + ' ' + dis + ' /> ' +
      '<span>É uma <strong>opção alternativa</strong> em comparação — não soma no orçamento até ser escolhida</span></label>' +
      '</div>' +
      '<div class="detail-block research-block">' +
      '<label class="note-label">Link do fornecedor (opcional)</label>' +
      '<div class="research-row">' +
      '<input class="supplier-url-input" type="url" value="' + esc(it.supplierUrl) + '" placeholder="https://..." data-field="supplierUrl" ' + dis + ' />' +
      '<button class="research-btn" data-action="research-prompt" title="Copiar prompt de pesquisa para colar numa sessão com o Chrome conectado">🔎 Pesquisar cotação</button>' +
      '</div></div>';
    if (kind === "voo") detailHTML += legsTableHTML(it, dis) + faresTableHTML(it, dis);
    else if (kindDef.fields) detailHTML += fieldsFormHTML(it, kindDef, dis);
    detailHTML += '<div class="detail-block"><label class="note-label">Observações</label><textarea class="note-input" data-field="note" ' + dis + ' placeholder="Anotações sobre esta cotação...">' + esc(it.note) + '</textarea></div>';

    var kindBadgeText = kindDef.label + (it.currency === "USD" ? " · USD" : "") + (it.unit === "pax" ? " · por pax" : "");
    return '<div class="item-row' + (it.altOnly ? " alt-option" : "") + '" data-item="' + it.id + '" data-cat="' + cat.id + '">' +
      '<input type="checkbox" class="chk" ' + (it.quoted ? "checked" : "") + " " + dis + ' data-action="toggle-quoted" title="Cotação confirmada" />' +
      '<input class="item-name-input" value="' + esc(it.name) + '" placeholder="Nome do item" title="' + esc(it.name) + '" data-field="name" ' + dis + ' />' +
      '<input class="item-supplier-input" value="' + esc(it.supplier) + '" placeholder="Fornecedor" title="' + esc(it.supplier) + '" data-field="supplier" ' + dis + ' />' +
      '<span class="kind-badge" title="Clique em ▾ para mudar tipo/moeda/unidade">' + esc(kindBadgeText) + '</span>' +
      valueCellHTML +
      '<div class="row-actions">' +
      '<button class="expand-btn' + (expanded ? " open" : "") + '" data-action="toggle-expand" title="Detalhar">▾</button>' +
      (readOnly ? "" : '<button class="row-del" data-action="remove-item" title="Remover item">×</button>') +
      '</div>' +
      '</div>' +
      (expanded ? '<div class="item-detail">' + detailHTML + '</div>' : (it.note ? '<div class="item-note">' + esc(it.note) + '</div>' : ""));
  }

  function itemWrapHTML(op, cat, it) {
    return '<div class="item-wrap" data-item="' + it.id + '" data-cat="' + cat.id + '">' + itemRowHTML(op, cat, it) + '</div>';

  function categoryHTML(op, cat) {
    var subtotal = categorySubtotal(cat, op);
    var collapsed = !!local.collapsed[cat.id];
    var itemsHTML = cat.items.map(function (it) { return itemWrapHTML(op, cat, it); }).join("");
    return '<div class="category' + (collapsed ? " collapsed" : "") + '" data-cat-wrap="' + cat.id + '">' +
      '<div class="category-head" data-action="toggle-collapse" data-cat="' + cat.id + '">' +
      '<div class="category-head-left"><span class="chevron">▾</span>' +
      '<input class="category-name-input" value="' + esc(cat.name) + '" data-field="cat-name" data-cat="' + cat.id + '" ' + (readOnly ? "disabled" : "") + ' onclick="event.stopPropagation()" />' +
      '<span class="category-count">' + cat.items.length + ' ' + (cat.items.length === 1 ? "item" : "itens") + '</span></div>' +
      '<div style="display:flex;align-items:center;gap:14px;">' +
      '<span class="category-subtotal mono">' + fmtBRL(subtotal) + '</span>' +
      (readOnly ? "" : '<button class="icon-btn" data-action="remove-cat" data-cat="' + cat.id + '" title="Remover categoria" onclick="event.stopPropagation()">×</button>') +
      '</div></div>' +
      '<div class="category-body">' + itemsHTML +
      (readOnly ? "" : '<button class="add-item-btn" data-action="add-item" data-cat="' + cat.id + '">+ Adicionar item</button>') +
      '</div></div>';
  }

    var op = getActiveOp();
    if (!op) return '<div class="empty-state"><div class="glyph">🧾</div>Nenhuma operação ainda. Crie uma no menu ao lado.</div>';
    var catsHTML = op.categories.map(function (c) { return categoryHTML(op, c); }).join("");
    var hintHTML = local.hintDismissed ? "" :
      '<div class="hint-banner" id="hint-banner">' +
      '<div class="hint-banner-text"><strong>Comece por aqui:</strong> marque ✓ os itens que já têm uma cotação real confirmada — isso entra no total automaticamente. ' +
      'Linhas cinzas com a marca <span class="alt-badge" style="margin-left:0;">ALT</span> são opções alternativas em comparação e não somam no orçamento. ' +
      'Clique na seta ▾ de qualquer item pra ver detalhes, trocar tipo/moeda/unidade ou anotar observações.</div>' +
      '<button class="icon-btn" id="btn-dismiss-hint" title="Não mostrar de novo">×</button>' +
      '</div>';
    return '<div class="mobile-summary-toggle" id="btn-toggle-summary">📊 Ver resumo & precificação</div>' +
      hintHTML +
      '<div class="op-header">' +
      '<div><input class="op-title-input display" value="' + esc(op.name) + '" data-field="op-name" ' + (readOnly ? "disabled" : "") + ' />' +
      '<div class="op-meta-row">' +
      '<div class="meta-field"><label>Cliente</label><input value="' + esc(op.client) + '" data-field="op-client" style="width:180px;font-family:inherit;" ' + (readOnly ? "disabled" : "") + ' /></div>' +
      '<div class="meta-field"><label>Nº participantes</label><input type="number" value="' + op.pax + '" data-field="op-pax" ' + (readOnly ? "disabled" : "") + ' /></div>' +
      '<div class="meta-field"><label>Dólar de precificação</label><input type="number" step="0.01" value="' + op.dollarRate + '" data-field="op-dollar" ' + (readOnly ? "disabled" : "") + ' /></div>' +
      '</div></div>' +
      (readOnly ? "" : '<div class="op-actions"><button class="icon-btn" id="btn-del-op" title="Remover operação">×</button></div>') +
      '</div>' +
      catsHTML +
      (readOnly ? "" : '<button class="add-category-btn" id="btn-add-cat">+ Adicionar categoria</button>');
  }

  function renderSummary() {
    var op = getActiveOp();
    if (!op) return "";
    var s = computeOperation(op);
    var pct = s.itemsTotal ? Math.round((s.itemsQuoted / s.itemsTotal) * 100) : 0;
    var rate = Number(op.dollarRate) || 0;
    return '<div class="summary-block">' +
      '<div class="summary-label">Progresso da cotação</div>' +
      '<div class="progress-big-track"><div class="progress-big-fill" style="width:' + pct + '%"></div></div>' +
      '<div class="progress-big-text"><strong>' + s.itemsQuoted + ' de ' + s.itemsTotal + '</strong> itens confirmados</div>' +
      '</div>' +
      '<div class="summary-block">' +
      '<div class="summary-label">Parâmetros do modelo</div>' +
      '<div class="param-row"><label>Markup sobre fornecedores</label><input class="param-input" type="number" step="0.01" value="' + (op.markupPct * 100).toFixed(0) + '" data-field="op-markup" ' + (readOnly ? "disabled" : "") + ' />%</div>' +
      '<div class="param-row"><label>Contingência</label><input class="param-input" type="number" step="0.01" value="' + (op.contingencyPct * 100).toFixed(0) + '" data-field="op-conting" ' + (readOnly ? "disabled" : "") + ' />%</div>' +
      '<div class="param-row"><label>Mimos por participante</label><input class="param-input" type="number" step="1" value="' + op.giftPerPax + '" data-field="op-mimos" ' + (readOnly ? "disabled" : "") + ' /></div>' +
      '<div class="param-row"><label>Imposto (gross-up)</label><input class="param-input" type="number" step="0.5" value="' + (op.taxPct * 100).toFixed(1) + '" data-field="op-tax" ' + (readOnly ? "disabled" : "") + ' />%</div>' +
      '<div class="param-row"><label>Desconto à vista</label><input class="param-input" type="number" step="1" value="' + ((Number(op.avistaDiscountPct) || 0) * 100).toFixed(0) + '" data-field="op-avista" ' + (readOnly ? "disabled" : "") + ' />%</div>' +
      '</div>' +
      '<div class="summary-block">' +
      '<div class="summary-label">Montagem do preço</div>' +
      '<div class="ledger-row"><span>Custo fornecedores (A)</span><span class="val">' + fmtBRL(s.A) + '</span></div>' +
      '<div class="ledger-row muted"><span>+ Markup (' + fmtPct(op.markupPct) + ')</span><span class="val">' + fmtBRL(s.markup) + '</span></div>' +
      '<div class="ledger-row muted"><span>+ Contingência (' + fmtPct(op.contingencyPct) + ')</span><span class="val">' + fmtBRL(s.contingencia) + '</span></div>' +
      '<div class="ledger-row muted"><span>+ Mimos (' + op.pax + ' × ' + fmtBRL(op.giftPerPax) + ')</span><span class="val">' + fmtBRL(s.mimos) + '</span></div>' +
      '<div class="ledger-divider"></div>' +
      '<div class="ledger-row muted"><span>+ Imposto (gross-up)</span><span class="val">' + fmtBRL(s.imposto) + '</span></div>' +
      '<div class="ledger-total">' +
      '<div class="lbl">Preço parcelado (markup cobre custo de parcelamento)</div>' +
      '<div class="amt mono">' + fmtBRL(s.precoVenda) + '</div>' +
      '<div class="per-pax">' + fmtBRL(s.precoPorPax) + ' por participante</div>' +
      (rate ? '<div class="ledger-divider" style="border-color:rgba(255,255,255,0.15);margin:10px 0 8px;"></div>' +
        '<div class="per-pax">' + fmtUSD(s.precoVenda / rate) + ' total <span style="opacity:0.6;">(câmbio ' + rate.toLocaleString("pt-BR", { minimumFractionDigits: 2 }) + ')</span></div>' +
        '<div class="per-pax">' + fmtUSD(s.precoPorPax / rate) + ' por participante</div>' : '') +
      '</div>' +
      (s.precoAvista !== s.precoVenda ? '<div class="ledger-total avista">' +
        '<div class="lbl">Preço à vista (' + fmtPct(op.avistaDiscountPct) + ' de desconto)</div>' +
        '<div class="amt mono">' + fmtBRL(s.precoAvista) + '</div>' +
        '<div class="per-pax">' + fmtBRL(s.precoAvistaPorPax) + ' por participante</div>' +
        (rate ? '<div class="ledger-divider" style="border-color:rgba(11,61,56,0.18);margin:10px 0 8px;"></div>' +
          '<div class="per-pax">' + fmtUSD(s.precoAvista / rate) + ' total <span style="opacity:0.7;">(câmbio ' + rate.toLocaleString("pt-BR", { minimumFractionDigits: 2 }) + ')</span></div>' +
          '<div class="per-pax">' + fmtUSD(s.precoAvistaPorPax / rate) + ' por participante</div>' : '') +
        '</div>' : '') +

  function render() {
    var app = document.getElementById("app");
    app.innerHTML =
      '<div class="shell">' +
      '<div class="topbar"><div class="brandmark"><div class="glyph">G</div><div class="word">Grupos VTurismo</div><div class="tag">precificação de grupos</div></div>' + connBadgeHTML() + '</div>' +
      '<div class="sidebar" id="sidebar">' + renderSidebar() + '</div>' +
      '<div class="main" id="main">' + renderMain() + '</div>' +
      '<div class="summary-col' + (local.summaryOpenMobile ? " mobile-open" : "") + '" id="summary">' + renderSummary() + '</div>' +

  function findItem(op, catId, itemId) {
    var cat = op.categories.find(function (c) { return c.id === catId; });
    if (!cat) return {};
    var item = cat.items.find(function (i) { return i.id === itemId; });
    return { cat: cat, item: item };
  }

  function wireEvents() {
    var sidebar = document.getElementById("sidebar");
    sidebar.querySelectorAll("[data-op]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        local.activeOperationId = btn.getAttribute("data-op");
        local.summaryOpenMobile = false;
        saveLocalUI();
        render();
      });
    });
    var newOpBtn = document.getElementById("btn-new-op");
    if (newOpBtn) newOpBtn.addEventListener("click", openNewOpModal);

    var toggleSummary = document.getElementById("btn-toggle-summary");
    if (toggleSummary) toggleSummary.addEventListener("click", function () {
      local.summaryOpenMobile = !local.summaryOpenMobile;
      saveLocalUI();
      render();
    });

    var main = document.getElementById("main");
    var op = getActiveOp();
    if (!op) return;

    var dismissHintBtn = document.getElementById("btn-dismiss-hint");
    if (dismissHintBtn) dismissHintBtn.addEventListener("click", function () {
      local.hintDismissed = true;
      saveLocalUI();
      render();
    });

    var opNameInput = main.querySelector('[data-field="op-name"]');
    if (opNameInput) opNameInput.addEventListener("input", function () { op.name = this.value; scheduleSave(); render_sidebar_only(); });
    bindSimple(main, '[data-field="op-client"]', function (v) { op.client = v; });
    bindSimple(main, '[data-field="op-pax"]', function (v) { op.pax = Number(v) || 0; }, true);
    bindSimple(main, '[data-field="op-dollar"]', function (v) { op.dollarRate = Number(v) || 0; }, true);

    var delOpBtn = document.getElementById("btn-del-op");
    if (delOpBtn) delOpBtn.addEventListener("click", function () {
      if (confirm('Remover a operação "' + op.name + '"? Isso apaga todos os itens dela.')) removeOperation(op.id);
      render();
    });

    var addCatBtn = document.getElementById("btn-add-cat");
    if (addCatBtn) addCatBtn.addEventListener("click", function () { addCategory(op); render(); });

    main.querySelectorAll("[data-action='toggle-collapse']").forEach(function (head) {
      head.addEventListener("click", function () {
        var catId = head.getAttribute("data-cat");
        local.collapsed[catId] = !local.collapsed[catId];
        saveLocalUI();
        render();
      });
    });
    main.querySelectorAll("[data-action='remove-cat']").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var catId = btn.getAttribute("data-cat");
        if (confirm("Remover esta categoria e todos os itens dela?")) { removeCategory(op, catId); render(); }
      });
    });
    main.querySelectorAll("[data-action='add-item']").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var catId = btn.getAttribute("data-cat");
        var cat = op.categories.find(function (c) { return c.id === catId; });
        addItem(op, cat); render();
      });
    });
    main.querySelectorAll('[data-field="cat-name"]').forEach(function (input) {
      input.addEventListener("input", function () {
        var catId = this.getAttribute("data-cat");
        var cat = op.categories.find(function (c) { return c.id === catId; });
        cat.name = this.value; scheduleSave();
      });
    });

    main.querySelectorAll(".item-wrap").forEach(function (wrap) {
      var catId = wrap.getAttribute("data-cat");
      var itemId = wrap.getAttribute("data-item");
      var found = findItem(op, catId, itemId);
      var item = found.item;
      if (!item) return;
      var chk = wrap.querySelector("[data-action='toggle-quoted']");
      if (chk) chk.addEventListener("change", function () { item.quoted = this.checked; scheduleSave(true); render(); });
      var nameInput = wrap.querySelector('[data-field="name"]');
      if (nameInput) nameInput.addEventListener("input", function () { item.name = this.value; scheduleSave(); });
      var supInput = wrap.querySelector('[data-field="supplier"]');
      if (supInput) supInput.addEventListener("input", function () { item.supplier = this.value; scheduleSave(); });
      var kindSel = wrap.querySelector('[data-field="kind"]');
      if (kindSel) kindSel.addEventListener("change", function () {
        item.kind = this.value;
        ensureKindDefaults(item);
        local.expandedItems[item.id] = true;
        saveLocalUI();
        scheduleSave(true); render();
      });
      var curSel = wrap.querySelector('[data-field="currency"]');
      if (curSel) curSel.addEventListener("change", function () { item.currency = this.value; scheduleSave(true); render(); });
      var unitSel = wrap.querySelector('[data-field="unit"]');
      if (unitSel) unitSel.addEventListener("change", function () { item.unit = this.value; scheduleSave(true); render(); });
      var valInput = wrap.querySelector('[data-field="value"]');
      if (valInput) valInput.addEventListener("input", function () {
        item.value = this.value === "" ? null : Number(this.value);
        scheduleSave();
        updateLiveTotalsOnly();
      });
      var expandBtn = wrap.querySelector("[data-action='toggle-expand']");
      if (expandBtn) expandBtn.addEventListener("click", function () {
        local.expandedItems[item.id] = !local.expandedItems[item.id];
        saveLocalUI(); render();
      });
      var delBtn = wrap.querySelector("[data-action='remove-item']");
      if (delBtn) delBtn.addEventListener("click", function () { removeItem(found.cat, itemId); render(); });

      var noteInput = wrap.querySelector('[data-field="note"]');
      if (noteInput) noteInput.addEventListener("input", function () { item.note = this.value; scheduleSave(); });

      var altChk = wrap.querySelector('[data-field="altOnly"]');
      if (altChk) altChk.addEventListener("change", function () { item.altOnly = this.checked; scheduleSave(true); render(); });

      var urlInput = wrap.querySelector('[data-field="supplierUrl"]');
      if (urlInput) urlInput.addEventListener("input", function () { item.supplierUrl = this.value; scheduleSave(); });

      var researchBtn = wrap.querySelector("[data-action='research-prompt']");
      if (researchBtn) researchBtn.addEventListener("click", function () {
        var prompt = buildResearchPrompt(op, found.cat, item);
        copyToClipboard(prompt);
        showToast("Prompt copiado! Cole numa sessão com o Chrome conectado.");
      });

      var addLegBtn = wrap.querySelector("[data-action='add-leg']");
      if (addLegBtn) addLegBtn.addEventListener("click", function () {
        item.legs = item.legs || [];
        item.legs.push(Object.assign({}, ITEM_KINDS.voo.legTemplate));
        scheduleSave(true); render();
      });
      wrap.querySelectorAll("[data-leg-field]").forEach(function (input) {
        input.addEventListener("input", function () {
          var idx = Number(input.closest("[data-leg-idx]").getAttribute("data-leg-idx"));
          item.legs[idx][input.getAttribute("data-leg-field")] = this.value;
          scheduleSave();
        });
      });
      wrap.querySelectorAll("[data-action='remove-leg']").forEach(function (btn) {
        btn.addEventListener("click", function () {
          item.legs.splice(Number(btn.getAttribute("data-leg-idx")), 1);
          scheduleSave(true); render();
        });
      });

      var addFareBtn = wrap.querySelector("[data-action='add-fare']");
      if (addFareBtn) addFareBtn.addEventListener("click", function () {
        item.fares = item.fares || [];
        item.fares.push({ label: "", value: null });
        scheduleSave(true); render();
      });
      wrap.querySelectorAll("[data-fare-field]").forEach(function (input) {
        input.addEventListener("input", function () {
          var idx = Number(input.closest("[data-fare-idx]").getAttribute("data-fare-idx"));
          var field = input.getAttribute("data-fare-field");
          item.fares[idx][field] = field === "value" ? (this.value === "" ? null : Number(this.value)) : this.value;
          scheduleSave();
          updateLiveTotalsOnly();
          if (local.expandedItems[item.id]) {
            var headTotal = wrap.querySelector(".detail-block-head .mono");
            if (headTotal) headTotal.textContent = fmtMoney(item.fares.reduce(function (s, f) { return s + num(f.value); }, 0), item.currency);
            var valCell = wrap.querySelector(".value-computed");
            if (valCell) valCell.textContent = fmtMoney(derivedValue(item), item.currency);
          }
        });
      });
      wrap.querySelectorAll("[data-action='remove-fare']").forEach(function (btn) {
        btn.addEventListener("click", function () {
          item.fares.splice(Number(btn.getAttribute("data-fare-idx")), 1);
          scheduleSave(true); render();
        });
      });

      wrap.querySelectorAll("[data-field-key]").forEach(function (input) {
        input.addEventListener("input", function () {
          item.fields = item.fields || {};
          item.fields[input.getAttribute("data-field-key")] = this.value;
          scheduleSave();
          updateLiveTotalsOnly();
          if (local.expandedItems[item.id]) {
            var valCell = wrap.querySelector(".value-computed");
            if (valCell) valCell.textContent = fmtMoney(derivedValue(item), item.currency);
          }
        });
      });
    });

    bindSimple(document.getElementById("summary"), '[data-field="op-markup"]', function (v) { op.markupPct = (Number(v) || 0) / 100; }, true, true);
    bindSimple(document.getElementById("summary"), '[data-field="op-conting"]', function (v) { op.contingencyPct = (Number(v) || 0) / 100; }, true, true);
    bindSimple(document.getElementById("summary"), '[data-field="op-mimos"]', function (v) { op.giftPerPax = Number(v) || 0; }, true, true);
    bindSimple(document.getElementById("summary"), '[data-field="op-tax"]', function (v) { op.taxPct = (Number(v) || 0) / 100; }, true, true);
    bindSimple(document.getElementById("summary"), '[data-field="op-avista"]', function (v) { op.avistaDiscountPct = (Number(v) || 0) / 100; }, true, true);
  }

  function bindSimple(scope, selector, setter, isSummary) {
    var el = scope && scope.querySelector(selector);
    if (!el) return;
    el.addEventListener("input", function () {
      setter(this.value);
      scheduleSave();
      updateLiveTotalsOnly();
    });
  }

  function render_sidebar_only() {
    var sidebar = document.getElementById("sidebar");
    if (sidebar) { sidebar.innerHTML = renderSidebar(); wireSidebarOnly(); }
  }
  function wireSidebarOnly() {
    var sidebar = document.getElementById("sidebar");
    sidebar.querySelectorAll("[data-op]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        local.activeOperationId = btn.getAttribute("data-op");
        saveLocalUI();
        render();
      });
    });
    var newOpBtn = document.getElementById("btn-new-op");
    if (newOpBtn) newOpBtn.addEventListener("click", openNewOpModal);
  }

  function updateLiveTotalsOnly() {
    var summary = document.getElementById("summary");
    var active = document.activeElement;
    var activeField = (active && summary && summary.contains(active) && active.hasAttribute("data-field")) ? active.getAttribute("data-field") : null;
    var selStart = (activeField && typeof active.selectionStart === "number") ? active.selectionStart : null;
    var selEnd = (activeField && typeof active.selectionEnd === "number") ? active.selectionEnd : null;
    if (summary) summary.innerHTML = renderSummary();
    render_sidebar_only();
    var mainCats = document.querySelectorAll(".category-subtotal");
    var op = getActiveOp();
    if (op && mainCats.length === op.categories.length) {
      op.categories.forEach(function (cat, idx) {
        mainCats[idx].textContent = fmtBRL(categorySubtotal(cat, op));
      });
    }
    wireEventsSummaryOnly();
    if (activeField) {
      var restored = summary.querySelector('[data-field="' + activeField + '"]');
      if (restored) {
        restored.focus();
        if (selStart !== null && restored.setSelectionRange) {
          try { restored.setSelectionRange(selStart, selEnd); } catch (e) {}
        }
      }
    }
  }
  function wireEventsSummaryOnly() {
    var op = getActiveOp();
    if (!op) return;
    bindSimple(document.getElementById("summary"), '[data-field="op-markup"]', function (v) { op.markupPct = (Number(v) || 0) / 100; }, true);
    bindSimple(document.getElementById("summary"), '[data-field="op-conting"]', function (v) { op.contingencyPct = (Number(v) || 0) / 100; }, true);
    bindSimple(document.getElementById("summary"), '[data-field="op-mimos"]', function (v) { op.giftPerPax = Number(v) || 0; }, true);
    bindSimple(document.getElementById("summary"), '[data-field="op-tax"]', function (v) { op.taxPct = (Number(v) || 0) / 100; }, true);
    bindSimple(document.getElementById("summary"), '[data-field="op-avista"]', function (v) { op.avistaDiscountPct = (Number(v) || 0) / 100; }, true);
  }

  function openNewOpModal() {
    var backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    backdrop.innerHTML = '<div class="modal">' +
      '<h3>Nova operação</h3>' +
      '<div class="modal-field"><label>Nome da operação</label><input id="modal-name" placeholder="Ex.: Cliente X — Grupo Y" /></div>' +
      '<div class="modal-field"><label>Cliente</label><input id="modal-client" placeholder="Ex.: Memora Experience" /></div>' +
      '<div class="modal-field"><label>Número de participantes</label><input id="modal-pax" type="number" value="15" /></div>' +
      '<div class="modal-actions"><button class="btn btn-ghost" id="modal-cancel">Cancelar</button><button class="btn btn-primary" id="modal-create">Criar</button></div>' +
      '</div>';
    document.body.appendChild(backdrop);
    backdrop.addEventListener("click", function (e) { if (e.target === backdrop) backdrop.remove(); });
    document.getElementById("modal-cancel").addEventListener("click", function () { backdrop.remove(); });
    document.getElementById("modal-create").addEventListener("click", function () {
      var name = document.getElementById("modal-name").value.trim();
      var client = document.getElementById("modal-client").value.trim();
      var pax = Number(document.getElementById("modal-pax").value) || 15;
      if (!name) { document.getElementById("modal-name").focus(); return; }
      addOperation(name, client, pax);
      backdrop.remove();
      render();
    });
    setTimeout(function () { document.getElementById("modal-name").focus(); }, 30);
  }

  document.addEventListener("DOMContentLoaded", function () {
    render();
    initConn();
  });
  if (document.readyState !== "loading") { render(); initConn(); }
})();
</script>
